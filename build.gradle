plugins {
    id "java-library"
    id "maven-publish"
    id "net.neoforged.moddev.legacyforge" version "2.0.107"
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
    id "com.diffplug.spotless" version "7.0.2"
    id "idea"
}

tasks.named("wrapper", Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = project.mod_artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

def allIntegrationSourceSets = [
        "apothic_enchanting",
        "apotheosis",
        "touhou_little_maid",
]

def isIntegrationEnabled = { name ->
    providers.gradleProperty("enable_${name}_integration")
            .map { it.toBoolean() }
            .orElse(true)
            .get()
}

def enabledIntegrationSourceSets = allIntegrationSourceSets.findAll(isIntegrationEnabled)
def hasIntegration = { name -> enabledIntegrationSourceSets.contains(name) }

if (hasIntegration("apotheosis") && !hasIntegration("apothic_enchanting")) {
    throw new GradleException("The Apotheosis integration requires the enchanting integration source set")
}

sourceSets {
    enabledIntegrationSourceSets.each { name ->
        create(name) {
            java.srcDir "src/integration/${name}/java"
            resources.srcDir "src/integration/${name}/resources"
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            if (name == "apotheosis") {
                compileClasspath += sourceSets.apothic_enchanting.output
                runtimeClasspath += sourceSets.apothic_enchanting.output
            }
        }
    }
    main {
        enabledIntegrationSourceSets.each { name ->
            runtimeClasspath += sourceSets[name].output
        }
    }
}

def integrationClasses = tasks.register("integrationClasses") {
    group = "build"
    description = "Compiles every enabled optional integration source set."
    enabledIntegrationSourceSets.each { name ->
        dependsOn(tasks.named("${name}Classes"))
    }
}

tasks.named("build") {
    dependsOn(integrationClasses)
}

tasks.named("jar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].output
    }
    from(layout.buildDirectory.dir("mixin")) {
        enabledIntegrationSourceSets.each { name ->
            include "${mod_id}.${name}.refmap.json"
        }
    }
}

tasks.named("sourcesJar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].allJava
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = false
    accessTransformers.from "src/main/resources/META-INF/accesstransformer.cfg"

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            enabledIntegrationSourceSets.each { name ->
                sourceSet sourceSets[name]
            }
        }
    }

    runs {
        configureEach {
            systemProperty "forge.logging.markers", ""
            systemProperty "forge.logging.console.level", "info"
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            systemProperty "mixin.debug.export", "true"
        }

        client {
            client()
            gameDirectory = project.file("run")
        }

        server {
            server()
            gameDirectory = project.file("run/server")
            programArgument "--nogui"
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")
        }

        data {
            data()
            gameDirectory = project.file("run")
            systemProperty "forge.logging.markers", "REGISTRIES,REGISTRYDUMP"
            def dataArgs = [
                    "--mod", project.mod_id,
                    "--all",
                    "--output", file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath(),
                    "--existing", file("src/main/translations/").getAbsolutePath(),
                    "--existing-mod", "create",
                    "--existing-mod", "create_dragons_plus",
            ]
            enabledIntegrationSourceSets.each { name ->
                dataArgs.addAll("--existing", file("src/integration/${name}/resources/").getAbsolutePath())
            }
            programArguments.addAll(dataArgs)
        }
    }
}

repositories {
    mavenLocal()
    maven { url "https://maven.dragons.plus/releases" }
    maven { url "https://maven.createmod.net" }
    maven { url "https://maven.tterrag.com" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.theillusivec4.top/" }
    maven { url "https://maven.fallenbreath.me/releases" }
    maven { url "https://maven.shadowsoffire.dev/releases" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    jarJar(implementation("me.fallenbreath:conditional-mixin-forge:${conditional_mixin_version}"))

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim") {
        transitive = false
    }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("plus.dragons.createdragonsplus:create-dragons-plus-${minecraft_version}:${create_dragons_plus_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    enabledIntegrationSourceSets.each { name ->
        add("${name}AnnotationProcessor", "org.spongepowered:mixin:${mixin_version}:processor")
    }

    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}:api")
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")

    if (hasIntegration("apothic_enchanting") || hasIntegration("apotheosis")) {
        modImplementation("dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}")
        modImplementation("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}")
        modImplementation("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}")
        modImplementation("dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}")
    }

    if (hasIntegration("touhou_little_maid")) {
        modImplementation("curse.maven:touhou-little-maid-355044:${tlm_file_id}")
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    exclude ".cache"
}

def integrationMixinConfigs = [
        apothic_enchanting : "${mod_id}.apothic_enchanting.mixins.json",
        apotheosis         : "${mod_id}.apotheosis.mixins.json",
        touhou_little_maid : "${mod_id}.touhou_little_maid.mixins.json",
]

def integrationMixinBlocks = enabledIntegrationSourceSets
        .collect { integrationMixinConfigs[it] }
        .findAll { it != null }
        .collect { config -> "[[mixins]]\n    config=\"${config}\"" }
        .join("\n\n")

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version                  : minecraft_version,
            minecraft_version_range            : minecraft_version_range,
            forge_version_range                : forge_version_range,
            loader_version_range               : loader_version_range,
            mod_id                             : mod_id,
            mod_name                           : mod_name,
            mod_license                        : mod_license,
            mod_version                        : mod_version,
            mod_authors                        : mod_authors,
            mod_description                    : mod_description,
            mod_github                         : mod_github,
            create_version_range               : create_version_range,
            create_dragons_plus_version_range  : create_dragons_plus_version_range,
            apotheosis_version_range           : apotheosis_version_range,
            tlm_version_range                  : tlm_version_range,
            integration_mixin_blocks           : integrationMixinBlocks,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    enabledIntegrationSourceSets.each { name ->
        def configFile = integrationMixinConfigs[name]
        if (configFile != null) {
            add sourceSets[name], "${mod_id}.${name}.refmap.json"
            config configFile
        }
    }
}

tasks.withType(Jar).configureEach {
    from "LICENSE.txt"
    exclude ".cache"
}

tasks.named("jar", Jar) {
    manifest {
        attributes([
                "Specification-Title"      : mod_id,
                "Specification-Vendor"     : mod_authors,
                "Specification-Version"    : "1",
                "Implementation-Title"     : project.name,
                "Implementation-Version"   : project.version,
                "Implementation-Vendor"    : mod_authors,
                "Implementation-Timestamp" : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"             : (["${mod_id}.mixins.json"] + enabledIntegrationSourceSets.collect { integrationMixinConfigs[it] }.findAll { it != null }).join(","),
        ])
    }
}

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile "codeformat/formatter-config.xml"
        licenseHeaderFile "codeformat/HEADER.txt"
    }
}

build.dependsOn(spotlessApply)

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifactId = "${mod_artifact_id}-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name "DragonsPlus"
            url "https://maven.dragons.plus/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from sourcesJar.archiveFile
    changelog = project.file("CHANGELOG.md").text
    version = mod_version
    type = BETA
    displayName = "Create: Enchantment Industry ${mod_version} for Create ${create_version_production}"
    modLoaders.add("forge")

    curseforge {
        projectId = "688768"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
        requires("create-dragons-plus")
        client = true
        server = true
    }

    modrinth {
        projectId = "JWGBpFUP"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
        requires("create-dragons-plus")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xmaxerrs", "5000"])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
